<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Checklist dos treinos A, B e C com fotos, séries x repetições e cronômetro de descanso.">
<title>Treino ABC</title>
<style>
  [hidden] { display: none !important; }
  :root {
    /* layout: sticky day-tabs over a single scrolling exercise checklist (icon + name + editable reps + description), with a standing rest-timer card pinned at the end of each day */
    --bg: #15171a;
    --surface: #1d2126;
    --surface-2: #262b31;
    --fg: #f3f4f1;
    --fg-muted: #9aa0a6;
    --accent: #c6ff4d;
    --accent-ink: #15170a;
    --accent-2: #ff7a45;
    --border: #2d3238;
    --done: #8fce46;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --surface-2: #ece8df;
      --fg: #1b1c1e;
      --fg-muted: #60656b;
      --accent: #4f7d12;
      --accent-ink: #ffffff;
      --accent-2: #c65a2e;
      --border: #ddd8cd;
      --done: #4f7d12;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #ece8df;
    --fg: #1b1c1e;
    --fg-muted: #60656b;
    --accent: #4f7d12;
    --accent-ink: #ffffff;
    --accent-2: #c65a2e;
    --border: #ddd8cd;
    --done: #4f7d12;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #15171a;
    --surface: #1d2126;
    --surface-2: #262b31;
    --fg: #f3f4f1;
    --fg-muted: #9aa0a6;
    --accent: #c6ff4d;
    --accent-ink: #15170a;
    --accent-2: #ff7a45;
    --border: #2d3238;
    --done: #8fce46;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-block: 18px 32px;
  }
  .wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; width: 100%; }

  @media (min-width: 720px) {
    .wrap { max-width: 900px; }
  }

  h1, h2, h3 { font-family: 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .top { display: flex; align-items: center; gap: 12px; }
  .brand-icon { flex: none; width: 34px; height: 34px; color: var(--accent); }
  .top h1 { font-size: 1.5rem; font-weight: 700; color: var(--fg); }
  .top .sub { margin: 2px 0 0; font-size: 0.8rem; color: var(--fg-muted); }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tab {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--fg-muted); border-radius: 10px; padding: 10px 6px 9px;
    font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.03em;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 0;
  }
  .tab .letter { font-size: 1.3rem; font-weight: 700; line-height: 1; }
  .tab .focus { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.01em; text-transform: none; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .group-label { font-size: 0.78rem; color: var(--fg-muted); letter-spacing: 0.02em; margin: 0; }
  .group-label strong { color: var(--fg); }
  .hint { font-size: 0.72rem; color: var(--fg-muted); margin: 2px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-track { flex: 1; min-width: 0; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.25s ease; }
  .progress-count { flex: none; font-size: 0.78rem; color: var(--fg-muted); }

  .list { display: grid; grid-template-columns: 1fr; gap: 8px; }

  @media (min-width: 720px) {
    .list { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; min-width: 0;
  }
  .card.done { opacity: 0.6; }
  .check {
    flex: none; appearance: none; width: 24px; height: 24px; margin-top: 2px;
    border-radius: 7px; border: 2px solid var(--border); background: var(--surface-2);
    cursor: pointer; position: relative; display: grid; place-items: center;
  }
  .check:checked { background: var(--done); border-color: var(--done); }
  .check:checked::after {
    content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink);
    transform: rotate(-45deg) translateY(-1px);
  }
  .check:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .ex-icon-tile {
    flex: none; width: 56px; height: 56px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--border); display: grid; place-items: center; margin-top: 1px;
    overflow: hidden; padding: 0; font: inherit;
  }
  button.ex-icon-tile { appearance: none; cursor: pointer; }
  button.ex-icon-tile:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .ex-icon-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ex-icon { width: 30px; height: 30px; overflow: visible; }
  .icon-equip { color: var(--fg-muted); }
  .icon-move { color: var(--accent-2); }

  .lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(8, 9, 10, 0.86);
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  }
  .lightbox-figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; max-height: 100%; }
  .lightbox-figure img { max-width: min(92vw, 640px); max-height: 70vh; width: auto; height: auto; border-radius: 12px; display: block; background: var(--surface); }
  .lightbox-figure figcaption { color: #fff; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.85rem; text-align: center; max-width: 80vw; }
  .lightbox-close {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px;
    width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255, 255, 255, 0.15);
    color: #fff; font-size: 1.4rem; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .lightbox-close:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .card-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .ex-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ex-name { font-size: 0.98rem; font-weight: 600; line-height: 1.25; flex: 1; min-width: 80px; }
  .card.done .ex-name { text-decoration: line-through; text-decoration-color: var(--fg-muted); }
  .rep-input {
    flex: none; width: 64px; text-align: center; appearance: none; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--fg); border-radius: 7px; padding: 3px 4px;
    font-size: 0.78rem; font-weight: 600;
  }
  .rep-input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .ex-tag {
    align-self: flex-start; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 99px; padding: 1px 8px;
  }
  .ex-desc { font-size: 0.86rem; line-height: 1.45; color: var(--fg-muted); max-width: 65ch; margin: 0; }

  .reset-row { display: flex; justify-content: flex-end; }
  .btn-ghost {
    appearance: none; background: none; border: 1px solid var(--border); color: var(--fg-muted);
    border-radius: 8px; padding: 7px 12px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { color: var(--fg); border-color: var(--fg-muted); }
  .btn-ghost:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .timer-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 420px; margin-inline: auto;
  }
  .timer-card h2 { font-size: 0.95rem; color: var(--fg-muted); }
  .timer-display { font-size: 2.6rem; font-weight: 600; letter-spacing: 0.02em; }
  .timer-display.running { color: var(--accent); }
  .timer-display.ended { color: var(--accent-2); }
  .timer-presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .preset {
    appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
    border-radius: 8px; padding: 7px 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; cursor: pointer;
  }
  .preset[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .preset:focus-visible, .btn-primary:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .timer-controls { display: flex; gap: 10px; }
  .btn-primary {
    appearance: none; border: none; background: var(--accent); color: var(--accent-ink);
    border-radius: 9px; padding: 10px 22px; font-family: 'Oswald', sans-serif; text-transform: uppercase;
    letter-spacing: 0.03em; font-weight: 600; font-size: 0.88rem; cursor: pointer;
  }
  .btn-secondary {
    appearance: none; border: 1px solid var(--border); background: none; color: var(--fg);
    border-radius: 9px; padding: 10px 18px; font-family: 'Oswald', sans-serif; text-transform: uppercase;
    letter-spacing: 0.03em; font-weight: 600; font-size: 0.88rem; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <!-- equipment -->
    <symbol id="eq-barbell" viewBox="0 0 64 64">
      <line x1="14" y1="42" x2="50" y2="42" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <rect x="8" y="34" width="6" height="16" rx="2" fill="currentColor"/>
      <rect x="50" y="34" width="6" height="16" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="eq-dumbbell" viewBox="0 0 64 64">
      <line x1="22" y1="42" x2="42" y2="42" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <rect x="14" y="36" width="8" height="12" rx="2" fill="currentColor"/>
      <rect x="42" y="36" width="8" height="12" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="eq-cable" viewBox="0 0 64 64">
      <line x1="32" y1="6" x2="32" y2="34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="18" y1="34" x2="46" y2="34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="eq-machine" viewBox="0 0 64 64">
      <rect x="14" y="40" width="30" height="6" rx="2" fill="currentColor"/>
      <rect x="40" y="16" width="6" height="26" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="eq-body" viewBox="0 0 64 64">
      <circle cx="32" cy="14" r="6" fill="currentColor"/>
      <line x1="32" y1="20" x2="32" y2="40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="32" y1="40" x2="20" y2="56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="32" y1="40" x2="44" y2="56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="32" y1="24" x2="18" y2="34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="32" y1="24" x2="46" y2="34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <!-- motion arrows -->
    <symbol id="mv-up" viewBox="0 0 64 64">
      <line x1="32" y1="26" x2="32" y2="12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="32,4 25,15 39,15" fill="currentColor"/>
    </symbol>
    <symbol id="mv-down" viewBox="0 0 64 64">
      <line x1="32" y1="6" x2="32" y2="20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="32,28 25,17 39,17" fill="currentColor"/>
    </symbol>
    <symbol id="mv-out" viewBox="0 0 64 64">
      <line x1="30" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="8,16 19,10 19,22" fill="currentColor"/>
      <line x1="34" y1="16" x2="47" y2="16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="56,16 45,10 45,22" fill="currentColor"/>
    </symbol>
    <symbol id="mv-in" viewBox="0 0 64 64">
      <line x1="14" y1="16" x2="27" y2="16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="32,16 22,10 22,22" fill="currentColor"/>
      <line x1="50" y1="16" x2="37" y2="16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="32,16 42,10 42,22" fill="currentColor"/>
    </symbol>
    <symbol id="mv-pull" viewBox="0 0 64 64">
      <line x1="50" y1="8" x2="31" y2="23" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <polygon points="24,28 31,19 37,29" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <svg class="brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="20" width="6" height="8" rx="1.5" fill="currentColor"/>
      <rect x="9" y="16" width="5" height="16" rx="1.5" fill="currentColor"/>
      <rect x="14" y="22" width="20" height="4" rx="1" fill="currentColor"/>
      <rect x="34" y="16" width="5" height="16" rx="1.5" fill="currentColor"/>
      <rect x="40" y="20" width="6" height="8" rx="1.5" fill="currentColor"/>
    </svg>
    <div>
      <h1>Treino ABC</h1>
      <p class="sub">Checklist de execução e cronômetro de descanso</p>
    </div>
  <p style="margin:2px 0 0;font-size:0.78rem"><a href="retomada.html" style="color:var(--accent-2)">Ver Treino Retomada &rarr;</a></p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Dia de treino"></nav>

  <section id="dayPanel" role="tabpanel"></section>

  <section class="timer-card">
    <h2>Descanso entre séries</h2>
    <div class="timer-display mono" id="timerDisplay">01:30</div>
    <div class="timer-presets" id="presets" role="group" aria-label="Tempo de descanso"></div>
    <div class="timer-controls">
      <button class="btn-primary" id="timerToggle" type="button">Iniciar</button>
      <button class="btn-secondary" id="timerReset" type="button">Zerar</button>
    </div>
  </section>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fechar">&times;</button>
  <figure class="lightbox-figure">
    <img id="lightboxImg" src="" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
</div>

<script>
(function () {
  "use strict";

  var DIAS = [
    {
      id: "a", letra: "A", foco: "Peito, deltoide anterior/medial e tríceps",
      exercicios: [
        { id: "a1", nome: "Supino reto com barra ou halter", grupo: "Peito", reps: "4x10", eq: "eq-barbell", mv: "mv-up", desc: "Deitado no banco, pegada um pouco mais aberta que os ombros. Desça a barra até tocar levemente o peito e empurre para cima sem travar os cotovelos com força total." },
        { id: "a2", nome: "Crossover na polia", grupo: "Peito", reps: "3x12", eq: "eq-cable", mv: "mv-in", desc: "Em pé entre as polias altas, tronco levemente inclinado à frente. Puxe os cabos em arco até se cruzarem na frente do corpo, cotovelos levemente flexionados." },
        { id: "a3", nome: "Supino inclinado com barra ou halter", grupo: "Peito superior", reps: "4x10", eq: "eq-barbell", mv: "mv-up", desc: "Banco inclinado a 30–45°. Mesma mecânica do supino reto, mas o ângulo direciona o estímulo para a porção superior do peitoral." },
        { id: "a4", nome: "Crucifixo na máquina", grupo: "Peito", reps: "3x12", eq: "eq-machine", mv: "mv-in", desc: "Sentado, costas apoiadas, cotovelos levemente flexionados e fixos. Feche os braços à frente do peito em arco, sem usar os ombros para empurrar." },
        { id: "a5", nome: "Elevação frontal com barra ou anilha", grupo: "Deltoide anterior", reps: "3x12", eq: "eq-dumbbell", mv: "mv-up", desc: "Em pé, segure a barra ou anilha à frente do corpo. Eleve com os braços quase estendidos até a altura dos ombros e controle a descida." },
        { id: "a6", nome: "Elevação lateral com halteres ou na polia", grupo: "Deltoide medial", reps: "3x12", eq: "eq-dumbbell", mv: "mv-out", desc: "Braços ao lado do corpo, cotovelos levemente flexionados. Eleve lateralmente até a altura dos ombros, como servindo uma bandeja." },
        { id: "a7", nome: "Desenvolvimento com halteres ou barra", grupo: "Ombro", reps: "4x10", eq: "eq-dumbbell", mv: "mv-up", desc: "Halteres na altura dos ombros, empurre para cima até quase estender os braços, sem travar os cotovelos." },
        { id: "a8", nome: "Tríceps polia com corda", grupo: "Tríceps", reps: "3x12", eq: "eq-cable", mv: "mv-down", desc: "Na polia alta com corda, cotovelos fixos ao lado do corpo. Estenda os braços para baixo e abra levemente as pontas da corda no final." },
        { id: "a9", nome: "Tríceps polia supinada ou testa com barra W", grupo: "Tríceps", reps: "3x12", eq: "eq-cable", mv: "mv-down", desc: "Pegada supinada na polia para variar o estímulo, ou tríceps testa: deitado, barra W, desça até quase tocar a testa e estenda os braços." }
      ]
    },
    {
      id: "b", letra: "B", foco: "Costas, deltoide posterior, trapézio e bíceps",
      exercicios: [
        { id: "b1", nome: "Puxada frontal aberta", grupo: "Dorsal", reps: "4x10", eq: "eq-cable", mv: "mv-down", desc: "Pegada pronada na barra reta, mais aberta que a largura dos ombros. Puxe até a altura do peito, cotovelos apontando para baixo." },
        { id: "b2", nome: "Puxada neutra aberta", grupo: "Dorsal", reps: "4x10", eq: "eq-cable", mv: "mv-down", desc: "Barra neutra em V ou paralela, palmas de frente uma para a outra. Reduz o estresse no ombro e recruta o bíceps como auxiliar." },
        { id: "b3", nome: "Pulldown na polia (braço reto)", grupo: "Dorsal", reps: "3x12", eq: "eq-cable", mv: "mv-down", desc: "Corda ou barra reta na polia alta, braços estendidos. Puxe para baixo em arco até a coxa, cotovelos quase travados." },
        { id: "b4", nome: "Remada cavalinho", grupo: "Costas", reps: "4x10", eq: "eq-barbell", mv: "mv-pull", desc: "Em pé apoiado no peitoral, ou com barra T. Puxe o peso até o abdômen, cotovelos próximos ao corpo, espremendo as escápulas." },
        { id: "b5", nome: "Remada aberta na máquina", grupo: "Deltoide posterior", reps: "3x12", eq: "eq-machine", mv: "mv-pull", desc: "Sentado, pegada aberta nos handles, cotovelos apontando para fora. Puxe até a altura dos ombros." },
        { id: "b6", nome: "Crucifixo inverso na máquina ou com halteres", grupo: "Deltoide posterior", reps: "3x12", eq: "eq-machine", mv: "mv-out", desc: "Tronco inclinado à frente, braços levemente flexionados. Abra em arco até a linha dos ombros, controlado." },

  };
  DIAS.forEach(function (dia) { dia.exercicios.forEach(function (ex) { if (IMG[ex.id]) ex.img = IMG[ex.id]; }); });

  var STORE_PREFIX = "treino-abc:";

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  var tabsEl = document.getElementById("tabs");
  var panelEl = document.getElementById("dayPanel");
  var activeDay = readJSON(STORE_PREFIX + "active", "a");
  if (!DIAS.some(function (d) { return d.id === activeDay; })) activeDay = "a";
  var repsOverrides = readJSON(STORE_PREFIX + "reps", {});

  // ---- Lightbox (tap a photo to enlarge) ----
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lightboxCaption = document.getElementById("lightboxCaption");
  var lightboxClose = document.getElementById("lightboxClose");
  var lastFocused = null;

  function openLightbox(src, caption, triggerEl) {
    lastFocused = triggerEl || null;
    lightboxImg.src = src;
    lightboxImg.alt = caption;
    lightboxCaption.textContent = caption;
    lightbox.hidden = false;
    lightboxClose.focus();
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.src = "";
    if (lastFocused) lastFocused.focus();
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !lightbox.hidden) closeLightbox();
  });


  function renderTabs() {
    tabsEl.innerHTML = "";
    DIAS.forEach(function (dia) {
      var btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", dia.id === activeDay ? "true" : "false");
      btn.dataset.day = dia.id;
      btn.innerHTML = '<span class="letter">' + dia.letra + '</span><span class="focus">' + dia.foco.split(",")[0] + "</span>";
      btn.addEventListener("click", function () {
        activeDay = dia.id;
        writeJSON(STORE_PREFIX + "active", activeDay);
        renderTabs();
        renderPanel();
      });
      tabsEl.appendChild(btn);
    });
  }

  function getDone(dayId) {
    return readJSON(STORE_PREFIX + dayId, []);
  }
  function setDone(dayId, arr) {
    writeJSON(STORE_PREFIX + dayId, arr);
  }

  function svgIcon(eq, mv) {
    return '<svg class="ex-icon" viewBox="0 0 64 64" aria-hidden="true">' +
      '<use href="#' + eq + '" class="icon-equip"></use>' +
      '<use href="#' + mv + '" class="icon-move"></use>' +
      '</svg>';
  }

  function iconMarkup(ex) {
    if (ex.img) {
      return '<img src="' + ex.img + '" alt="" loading="lazy" decoding="async">';
    }
    return svgIcon(ex.eq, ex.mv);
  }

  function renderPanel() {
    var dia = DIAS.filter(function (d) { return d.id === activeDay; })[0];
    var done = getDone(dia.id);

    var wrap = document.createElement("div");
    wrap.style.display = "flex";
    wrap.style.flexDirection = "column";
    wrap.style.gap = "10px";

    var groupLabel = document.createElement("p");
    groupLabel.className = "group-label";
    groupLabel.innerHTML = "Treino " + dia.letra + " &middot; <strong>" + dia.foco + "</strong>";
    wrap.appendChild(groupLabel);

    var hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Toque no número de séries × repetições para ajustar à sua ficha.";
    wrap.appendChild(hint);

    var progressRow = document.createElement("div");
    progressRow.className = "progress-row";
    var track = document.createElement("div");
    track.className = "progress-track";
    var fill = document.createElement("div");
    fill.className = "progress-fill";
    track.appendChild(fill);
    var count = document.createElement("span");
    count.className = "progress-count mono";
    progressRow.appendChild(track);
    progressRow.appendChild(count);
    wrap.appendChild(progressRow);

    var list = document.createElement("div");
    list.className = "list";

    dia.exercicios.forEach(function (ex) {
      var isDone = done.indexOf(ex.id) !== -1;
      var repsValue = repsOverrides[ex.id] || ex.reps;

      var card = document.createElement("div");
      card.className = "card" + (isDone ? " done" : "");

      var check = document.createElement("input");
      check.type = "checkbox";
      check.className = "check";
      check.checked = isDone;
      check.id = "chk-" + ex.id;
      check.setAttribute("aria-label", "Marcar " + ex.nome + " como concluído");
      check.addEventListener("change", function () {
        var current = getDone(dia.id);
        var idx = current.indexOf(ex.id);
        if (check.checked && idx === -1) current.push(ex.id);
        if (!check.checked && idx !== -1) current.splice(idx, 1);
        setDone(dia.id, current);
        renderPanel();
      });

      var iconTile;
      if (ex.img) {
        iconTile = document.createElement("button");
        iconTile.type = "button";
        iconTile.setAttribute("aria-label", "Ampliar foto de " + ex.nome);
        iconTile.addEventListener("click", function () {
          openLightbox(ex.img, ex.nome, iconTile);
        });
      } else {
        iconTile = document.createElement("div");
      }
      iconTile.className = "ex-icon-tile";
      iconTile.innerHTML = iconMarkup(ex);

      var body = document.createElement("div");
      body.className = "card-body";

      var top = document.createElement("div");
      top.className = "ex-top";

      var name = document.createElement("label");
      name.className = "ex-name";
      name.setAttribute("for", check.id);
      name.textContent = ex.nome;

      var repInput = document.createElement("input");
      repInput.type = "text";
      repInput.className = "rep-input mono";
      repInput.value = repsValue;
      repInput.setAttribute("aria-label", "Séries e repetições de " + ex.nome);
      repInput.addEventListener("change", function () {
        var val = repInput.value.trim() || ex.reps;
        repInput.value = val;
        repsOverrides[ex.id] = val;
        writeJSON(STORE_PREFIX + "reps", repsOverrides);
      });

      top.appendChild(name);
      top.appendChild(repInput);

      var tag = document.createElement("span");
      tag.className = "ex-tag";
      tag.textContent = ex.grupo;

      var desc = document.createElement("p");
      desc.className = "ex-desc";
      desc.textContent = ex.desc;

      body.appendChild(top);
      body.appendChild(tag);
      body.appendChild(desc);

      card.appendChild(check);
      card.appendChild(iconTile);
      card.appendChild(body);
      list.appendChild(card);
    });

    wrap.appendChild(list);

    var resetRow = document.createElement("div");
    resetRow.className = "reset-row";
    var resetBtn = document.createElement("button");
    resetBtn.type = "button";
    resetBtn.className = "btn-ghost";
    resetBtn.textContent = "Reiniciar treino " + dia.letra;
    resetBtn.addEventListener("click", function () {
      setDone(dia.id, []);
      renderPanel();
    });
    resetRow.appendChild(resetBtn);
    wrap.appendChild(resetRow);

    panelEl.innerHTML = "";
    panelEl.appendChild(wrap);

    var total = dia.exercicios.length;
    var concluidos = done.length;
    fill.style.width = (total ? (concluidos / total) * 100 : 0) + "%";
    count.textContent = concluidos + " de " + total;
  }

  renderTabs();
  renderPanel();

  // ---- Rest timer ----
  var PRESETS = [60, 90, 120];
  var presetsEl = document.getElementById("presets");
  var displayEl = document.getElementById("timerDisplay");
  var toggleBtn = document.getElementById("timerToggle");
  var resetBtn = document.getElementById("timerReset");

  var activePreset = readJSON(STORE_PREFIX + "preset", 90);
  var remaining = activePreset;
  var intervalId = null;
  var audioCtx = null;

  function formatTime(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function renderPresets() {
    presetsEl.innerHTML = "";
    PRESETS.forEach(function (sec) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "preset";
      btn.textContent = sec + "s";
      btn.setAttribute("aria-pressed", sec === activePreset ? "true" : "false");
      btn.addEventListener("click", function () {
        stopTimer();
        activePreset = sec;
        remaining = sec;
        writeJSON(STORE_PREFIX + "preset", activePreset);
        renderPresets();
        updateDisplay();
      });
      presetsEl.appendChild(btn);
    });
  }

  function updateDisplay() {
    displayEl.textContent = formatTime(remaining);
    displayEl.classList.toggle("running", intervalId !== null);
    displayEl.classList.toggle("ended", remaining === 0 && intervalId === null);
  }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.frequency.value = 880;
      o.connect(g);
      g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
      o.start();
      o.stop(audioCtx.currentTime + 0.5);
    } catch (e) {}
  }

  function stopTimer() {
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    toggleBtn.textContent = "Iniciar";
    updateDisplay();
  }

  function startTimer() {
    if (remaining === 0) remaining = activePreset;
    intervalId = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        remaining = 0;
        stopTimer();
        beep();
        updateDisplay();
        return;
      }
      updateDisplay();
    }, 1000);
    toggleBtn.textContent = "Pausar";
    updateDisplay();
  }

  toggleBtn.addEventListener("click", function () {
    if (intervalId) stopTimer();
    else startTimer();
  });

  resetBtn.addEventListener("click", function () {
    stopTimer();
    remaining = activePreset;
    updateDisplay();
  });

  renderPresets();
  updateDisplay();

  // Preserve state across hot republishes while this page is open
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () {
      return { activeDay: activeDay, remaining: remaining, activePreset: activePreset };
    });
  }
})();
</script>
